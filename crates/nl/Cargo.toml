[package]
name = "luria-nl"
description = "luria's model adapter: what a language model returns, read strictly. No scientific logic."
version = "0.1.0"
edition = "2021"

[lib]
name = "luria_nl"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false }
